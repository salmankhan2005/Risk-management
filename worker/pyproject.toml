[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "riskwatch-worker"
version = "1.0.0"
description = "Deterministic risk dataset generator, background worker, rules engine and validation suite for RiskWatch"
authors = [{ name = "RiskWatch Engineering Team" }]
dependencies = [
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
]

[project.scripts]
riskwatch-worker = "riskwatch_worker.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

